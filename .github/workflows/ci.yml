# Pruebas automáticas antes de fusionar (auditoría 17-nov-2026, hallazgo D4).
# En cada PR que toque código, config, panel o workflows: pasa todas las pruebas de Python, construye el panel
# y comprueba que no tiene errores. Sin secretos, sin red de mercado, sin órdenes. Gratis (repo público).
name: Pruebas

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "config/**"
      - "web/**"
      - "pyproject.toml"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ALPACA_PAPER: "true"
      ETORO_DEMO: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --quiet -e ".[dev]"
      - name: Todas las pruebas
        run: python -m pytest -q

  panel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Construir el panel
        run: node web/build.mjs
      - name: Prueba de humo del panel
        run: node web/test/humo.mjs
