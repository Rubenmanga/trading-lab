name: Agente C FX - tests de seguridad

on:
  push:
    branches: ["feature/agente-c-forex-eurusd-demo-20261117"]
    paths:
      - "src/tradinglab/fx/**"
      - "tests/test_fx_agent.py"
      - ".github/workflows/fx-agent-ci.yml"
  workflow_dispatch:
  pull_request:
    paths:
      - "src/tradinglab/fx/**"
      - "tests/test_fx_agent.py"
      - ".github/workflows/fx-agent-ci.yml"

permissions:
  contents: read

jobs:
  fx-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias mínimas
        run: python -m pip install --quiet pytest
      - name: Validar sintaxis y seguridad sin credenciales MT5
        env:
          PYTHONPATH: src
        run: |
          python -m compileall -q src/tradinglab/fx
          pytest -q tests/test_fx_agent.py
