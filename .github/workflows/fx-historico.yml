name: Agente C FX - backtest externo EURUSD (bid/ask)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/tradinglab/fx/**"
      - ".github/workflows/fx-historico.yml"

permissions:
  contents: read

jobs:
  fx-exploration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dependencias Python
        run: python -m pip install --quiet pytest
      - name: Validar código y contratos
        env:
          PYTHONPATH: src
        run: |
          python -m compileall -q src/tradinglab/fx
          pytest -q tests/test_fx_agent.py
      - name: Descargar BID y ASK EURUSD del 1 septiembre al 16 noviembre 2026 (exploratorio)
        run: |
          npx -y dukascopy-node@1.51.1 -i eurusd -from 2026-09-01 -to 2026-11-17 \
            -t m5 -p bid -f csv -dir data/fx-download -fn eurusd_bid \
            -r 3 --cache --batch-size 5 --batch-pause 1200
          npx -y dukascopy-node@1.51.1 -i eurusd -from 2026-09-01 -to 2026-11-17 \
            -t m5 -p ask -f csv -dir data/fx-download -fn eurusd_ask \
            -r 3 --cache --batch-size 5 --batch-pause 1200
      - name: Convertir y simular cinco hipótesis con coste/spread
        env:
          PYTHONPATH: src
        run: |
          python -m tradinglab.fx.dukascopy \
            data/fx-download/eurusd_bid.csv data/fx-download/eurusd_ask.csv \
            data/fx-processed/eurusd_m5_bidask.csv
          python -m tradinglab.fx backtest data/fx-processed/eurusd_m5_bidask.csv \
            --output investigacion/fx/backtest-exploratorio.json \
            --slippage 0.15 --commission 0.25
      - uses: actions/upload-artifact@v4
        with:
          name: agente-c-fx-backtest
          path: |
            investigacion/fx/backtest-exploratorio.json
            data/fx-processed/eurusd_m5_bidask.csv
          if-no-files-found: error
          retention-days: 14
