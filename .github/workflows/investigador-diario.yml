# Investigador diario con IA, fuentes de hoy y descubrimiento de empresas nuevas.
# GEMINI_API_KEY debe estar en Settings > Secrets and variables > Actions.
# Si no hay clave o la IA falla: error visible, no se publica análisis sin IA.
name: Investigador diario IA

on:
  schedule:
    - cron: "17 8 * * 1-5"
      timezone: Europe/Madrid
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/investigador-diario.yml"
      - "src/tradinglab/medio_plazo/investigador_ia.py"
      - "src/tradinglab/medio_plazo/investigador_fuentes.py"
      - "tests/test_investigador_ia.py"
      - "src/tradinglab/medio_plazo/propuestas.py"

permissions:
  contents: write

concurrency:
  group: investigador-diario-ia
  cancel-in-progress: false

jobs:
  investigar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar pytest
        run: python -m pip install --quiet pytest
      - name: Tests de actualidad, fuentes, IA y memoria de evitar
        run: python -m pytest -q tests/test_propuestas.py tests/test_investigador_ia.py
      - name: Investigación diaria con IA
        if: github.event_name != 'pull_request'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          INVESTIGADOR_GEMINI_MODELO: gemini-2.5-flash-lite
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Falta GEMINI_API_KEY. Configura un secreto en GitHub Actions."
            exit 1
          fi
          python -m tradinglab.medio_plazo.investigador_ia
      - name: Publicar investigación y memoria del radar
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "investigador-diario-ia"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add investigacion/investigador/ investigacion/propuestas/ investigacion/predicciones.csv
          if git diff --cached --quiet; then
            echo "Sin cambios: informe ya generado."
            exit 0
          fi
          git commit -m "Investigador IA: análisis diario $(TZ=Europe/Madrid date +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
