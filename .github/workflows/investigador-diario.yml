# Investigador diario autónomo: no consume tokens de Claude ni APIs de pago.
# Sólo usa los archivos que ya ha generado el agente B; nunca ejecuta órdenes.
name: Investigador diario sin Claude

on:
  schedule:
    - cron: "17 8 * * 1-5"
      timezone: Europe/Madrid
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/investigador-diario.yml"
      - "src/tradinglab/medio_plazo/investigador_auto.py"
      - "src/tradinglab/medio_plazo/propuestas.py"
      - "tests/test_investigador_auto.py"
      - "tests/test_propuestas.py"

permissions:
  contents: write

concurrency:
  group: investigador-diario
  cancel-in-progress: false

jobs:
  investigar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias de prueba
        run: python -m pip install --quiet pytest
      - name: Comprobar reglas, fechas, duplicados y riesgo
        run: python -m pytest -q tests/test_propuestas.py tests/test_investigador_auto.py
      - name: Previsualizar con los datos del repo (PR, sin publicar)
        if: github.event_name == 'pull_request'
        run: |
          python - <<'PY'
          from pathlib import Path
          from tradinglab.medio_plazo.investigador_auto import _fecha_carpeta, ejecutar
          dia = _fecha_carpeta(Path("investigacion/hoy.md").read_text(encoding="utf-8"))
          resultado = ejecutar(dia)
          print(resultado)
          ruta = Path("investigacion/propuestas") / f"{dia.isoformat()}.md"
          if ruta.exists():
              print(ruta.read_text(encoding="utf-8"))
          PY
      - name: Generar el informe y añadir predicciones (solo rama principal)
        if: github.event_name != 'pull_request'
        run: python -m tradinglab.medio_plazo.investigador_auto
      - name: Publicar nuevos datos (sin modificar código)
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "investigador-diario"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add investigacion/propuestas/ investigacion/predicciones.csv
          if git diff --cached --quiet; then
            echo "Sin cambios: ya existía el informe o no hay suficientes ideas verificables."
            exit 0
          fi
          git commit -m "Investigador diario: vigilancias $(TZ=Europe/Madrid date +%F)"
          # No ocultar conflictos: si otra tarea modificó el libro, la ejecución falla
          # y Github Actions informa. No usar push --force.
          git pull --rebase origin main
          git push origin HEAD:main
