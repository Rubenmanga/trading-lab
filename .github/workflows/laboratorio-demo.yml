# Laboratorio EN DIRECTO en la cuenta DEMO de Alpaca (dinero ficticio, ALPACA_PAPER=true).
# - «directo»: a las 9:30 NY (15:30 España) se conecta a Alpaca IEX (gratis, tiempo real, 30 acciones) y se queda
#   hasta las 13:05 NY (19:05 España). En cuanto cierra una vela de 1 min pasa las 5 estrategias, el filtro
#   «¿entrar o no?» y las reglas de riesgo, y envía órdenes con stop y objetivo ya puestos.
# - «pasada»: una sola pasada (con la historia por consulta). A las 15:47 NY (21:47 España) cierra todo lo que
#   abrió el laboratorio y apunta el resultado.
# Registro de cada decisión: investigacion/laboratorio/demo/registro.csv (sale en el panel, página Laboratorio).
#
# HORARIO DE INVIERNO (NY = UTC-5). Cuando EE. UU. cambie la hora (14-mar-2027) hay que restar 1 a las horas UTC.
name: Laboratorio demo (directo)

on:
  schedule:
    - cron: "28 14 * * 1-5"   # arranque del directo (9:28 NY; espera a las 9:32)
    - cron: "47 20 * * 1-5"   # cierre 15:47 NY
    - cron: "57 20 * * 1-5"   # repaso del cierre
  workflow_dispatch:
    inputs:
      modo:
        description: "directo (conexión continua) o pasada (una sola pasada o cierre)"
        type: choice
        options: [directo, pasada]
        default: directo
      ensayo:
        description: "true = todo menos enviar órdenes"
        default: "true"

permissions:
  contents: write

concurrency:
  group: laboratorio-demo
  cancel-in-progress: false

env:
  PYTHONPATH: src
  PYTHONUTF8: "1"
  ALPACA_PAPER: "true"
  ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
  ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}

jobs:
  directo:
    if: (github.event_name == 'schedule' && github.event.schedule == '28 14 * * 1-5') || (github.event_name == 'workflow_dispatch' && inputs.modo == 'directo')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar lo mínimo
        run: pip install --quiet "pyyaml>=6" "pandas>=2" "numpy>=1.24" requests "python-dotenv>=1" tzdata websockets
      - name: Fecha de Nueva York
        id: d
        run: echo "fecha=$(TZ=America/New_York date +%F)" >> "$GITHUB_OUTPUT"
      - name: Acciones del día (se calculan al arrancar y se reutilizan)
        uses: actions/cache@v4
        with:
          path: datos_demo
          key: demo-candidatas-${{ steps.d.outputs.fecha }}
      - name: Conexión en directo (y guardar el registro cada 10 min)
        run: |
          guardar() {
            git config user.name "laboratorio-demo"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add investigacion/laboratorio/demo 2>/dev/null || true
            git diff --cached --quiet && return 0
            git commit -q -m "Laboratorio demo: $(TZ=America/New_York date '+%F %H:%M') NY"
            for i in 1 2 3; do git pull --rebase --autostash -q && git push -q && break; sleep 5; done
          }
          python -u -m tradinglab.cli laboratorio directo --salida datos_demo --por-minuto 180 \
            ${{ github.event_name == 'workflow_dispatch' && inputs.ensayo == 'true' && '--ensayo' || '' }} &
          PID=$!
          while kill -0 $PID 2>/dev/null; do
            for i in $(seq 1 60); do kill -0 $PID 2>/dev/null || break; sleep 10; done
            guardar
          done
          wait $PID
          STATUS=$?
          guardar
          exit $STATUS

  pasada:
    if: (github.event_name == 'schedule' && github.event.schedule != '28 14 * * 1-5') || (github.event_name == 'workflow_dispatch' && inputs.modo == 'pasada')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar lo mínimo
        run: pip install --quiet "pyyaml>=6" "pandas>=2" "numpy>=1.24" requests "python-dotenv>=1" tzdata
      - name: Fecha de Nueva York
        id: d
        run: echo "fecha=$(TZ=America/New_York date +%F)" >> "$GITHUB_OUTPUT"
      - name: Acciones del día
        uses: actions/cache@v4
        with:
          path: datos_demo
          key: demo-candidatas-${{ steps.d.outputs.fecha }}
      - name: Pasada (o cierre a las 15:45 NY)
        run: |
          python -m tradinglab.cli laboratorio demo --salida datos_demo --por-minuto 180 \
            ${{ github.event_name == 'workflow_dispatch' && inputs.ensayo == 'true' && '--ensayo' || '' }}
      - name: Guardar el registro (sale en el panel)
        run: |
          git config user.name "laboratorio-demo"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add investigacion/laboratorio/demo 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -q -m "Laboratorio demo: $(TZ=America/New_York date '+%F %H:%M') NY"
          for i in 1 2 3; do git pull --rebase --autostash -q && git push -q && break; sleep 5; done
