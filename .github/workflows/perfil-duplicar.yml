# Perfil «¿puede duplicar?» del agente B (12 meses): mismo buscador, criterios de Ruben (config/perfil_duplicar.yaml).
# No toca el ranking normal: guarda en investigacion/duplicar/. Se lanza solo al cambiar el perfil,
# o a mano: Actions -> "Perfil duplicar" -> Run workflow.
name: Perfil duplicar

on:
  push:
    branches-ignore: [main]
    paths:
      - "config/perfil_duplicar.yaml"
      - "src/tradinglab/perfiles/**"
      - ".github/workflows/perfil-duplicar.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: perfil-duplicar
  cancel-in-progress: true

jobs:
  cribar:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PYTHONPATH: src
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet "pyyaml>=6" "pandas>=2" "numpy>=1.24" "yfinance>=0.2.50" "python-dotenv>=1" lxml tzdata pytest
      - name: Pruebas
        run: python -m pytest -q tests/test_perfil_duplicar.py tests/test_oportunidades.py
      - name: Buscar candidatas con el perfil
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python -m tradinglab.perfiles.duplicar ${{ hashFiles('investigacion/duplicar/universo.csv') != '' && '--desde-universo' || '' }}
      - name: Guardar resultados en la rama
        run: |
          git config user.name "perfil-duplicar"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add investigacion/duplicar/
          git diff --cached --quiet || git commit -m "Perfil duplicar: resultados $(date -u +%F)"
          git pull --rebase --autostash -q || true
          git push
