# Prueba de SOLO LECTURA de la API de eToro (demo) frente a Alpaca. No envía órdenes.
# Se lanza a mano: pestaña Actions -> "Prueba eToro" -> Run workflow. Guarda investigacion/etoro-prueba.md.
name: Prueba eToro

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Tickers separados por comas"
        default: "AAPL,AMSC,REPX,PGY,DCTH,ORIC"

permissions:
  contents: write

env:
  PYTHONPATH: src
  PYTHONUTF8: "1"
  ALPACA_PAPER: "true"
  ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
  ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
  ETORO_API_KEY: ${{ secrets.ETORO_API_KEY }}
  ETORO_USER_KEY: ${{ secrets.ETORO_USER_KEY }}

jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests
      - name: Prueba de solo lectura
        run: python -m tradinglab.common.etoro_prueba "${{ inputs.tickers }}" investigacion/etoro-prueba.md >> "$GITHUB_STEP_SUMMARY"
      - name: Guardar informe
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add investigacion/etoro-prueba.md
          git commit -m "Prueba eToro (solo lectura)" || echo "sin cambios"
          git push
