# Radar de resultados · PASO 1: prueba con el pasado (agente B, solo lectura, gratis, sin IA).
# Baja de Yahoo el historial de resultados y precios de las small caps de investigacion/duplicar/universo.csv,
# mide qué filtros de la víspera separan las que suben de las que caen («trampa de buenas noticias»)
# y guarda el informe en investigacion/radar/prueba-resultados.md (se ve en el panel, pestaña Informes).
# Se lanza solo al cambiar el código del radar en una rama, o a mano: Actions -> "Radar de resultados" -> Run workflow.
name: Radar de resultados

on:
  push:
    branches-ignore: [main]
    paths:
      - "src/tradinglab/radar/**"
      - ".github/workflows/radar-resultados.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-resultados
  cancel-in-progress: true

jobs:
  descargar:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        parte: [1, 2, 3, 4]
    env:
      PYTHONPATH: src
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar lo mínimo
        run: pip install --quiet "pyyaml>=6" "pandas>=2" "numpy>=1.24" "yfinance>=0.2.50" lxml beautifulsoup4 html5lib tzdata pytest
      - name: Pruebas
        run: python -m pytest -q tests/test_radar_resultados.py
      - name: Bajar resultados y precios de mi parte
        run: python -m tradinglab.cli radar parte --parte ${{ matrix.parte }} --de 4 --salida partes_radar/parte-${{ matrix.parte }}.jsonl --minutos 60
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radar-${{ matrix.parte }}
          path: partes_radar/
          retention-days: 3

  informe:
    needs: descargar
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet "pyyaml>=6" "pandas>=2" "numpy>=1.24" tzdata
      - uses: actions/download-artifact@v4
        with:
          pattern: radar-*
          path: partes_radar
          merge-multiple: true
      - name: Análisis e informe
        run: python -m tradinglab.cli radar informe --entrada partes_radar
      - name: Guardar en el repo
        run: |
          git config user.name "radar-resultados"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add investigacion/radar/
          git diff --cached --quiet || git commit -m "Radar de resultados: prueba con el pasado $(date -u +%F)"
          git pull --rebase --autostash -q || true
          git push
