# Vigilante en bucle: UN solo trabajo que mira cada 10 minutos hasta el cierre (plan B si el cron de GitHub se retrasa).
# Se lanza a mano (Actions → Run workflow). Mismo programa y mismos avisos que vigilante-intradia.yml.
name: Vigilante en bucle

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: vigilante-bucle
  cancel-in-progress: false

jobs:
  bucle:
    runs-on: ubuntu-latest
    timeout-minutes: 400
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar lo mínimo
        run: pip install --quiet "pyyaml>=6" "pandas>=2" "numpy>=1.24" "yfinance>=0.2.50" tzdata
      - name: Vigilar cada 10 minutos hasta el cierre de Nueva York
        env:
          PYTHONPATH: src
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "agente-12m"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh label create vigilante --color 0E8A16 --force >/dev/null 2>&1 || true
          while true; do
            ahora=$(TZ=America/New_York date +%H%M)
            if [ "$ahora" -ge 1606 ] || [ "$ahora" -lt 0900 ]; then echo "Fuera de la sesión: fin."; break; fi
            rm -f aviso.md
            python -m tradinglab.medio_plazo.vigilante || true
            git add investigacion/vigilante/ 2>/dev/null || true
            git diff --cached --quiet || git commit -q -m "Vigilante $(date -u +'%F %H:%M')"
            git pull --rebase --autostash -q || true
            git push -q || (sleep 5; git pull --rebase --autostash -q; git push -q) || true
            if [ -s aviso.md ]; then
              printf '\nDetalle: https://trading-lab-kappa.vercel.app/#/informes · Información, no una orden de compra o venta.\n' >> aviso.md
              gh issue create --title "👁 Vigilante $(TZ=Europe/Madrid date +'%H:%M') (España)" --body-file aviso.md --label vigilante --assignee "${{ github.repository_owner }}" || gh issue create --title "👁 Vigilante $(TZ=Europe/Madrid date +'%H:%M') (España)" --body-file aviso.md --label vigilante || true
            fi
            sleep 600
          done
