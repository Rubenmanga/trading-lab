# ============================================================
#  AGENTE B: INVERSIÓN A MEDIO PLAZO (12 meses)
# ============================================================
# Este agente NO compra ni vende solo. Analiza, guarda una lista de vigilancia
# y avisa cuando una empresa llega a su zona de entrada.

modo_cuenta: demo

# Filtro inicial ("cribado") de empresas pequeñas de EE. UU., de TODOS los sectores.
cribado:
  capitalizacion_min_usd: 300000000      # 300 millones $  (por debajo: "micro caps", demasiado riesgo)
  capitalizacion_max_usd: 2000000000     # 2.000 millones $ (definición habitual de small cap)
  volumen_medio_min: 200000              # acciones al día; si se negocia poco, cuesta entrar y salir
  precio_min_usd: 5                      # por debajo de 5 $ suelen ser acciones muy castigadas o especulativas
  analistas_min: 3                       # mínimo de analistas que la siguen
  potencial_min_pct: 30                  # subida mínima hasta el precio objetivo medio de los analistas
  potencial_max_pct: 150                 # una "subida" enorme suele indicar una acción hundida por un problema serio
  recomendaciones: [buy, strong_buy]     # consenso de los analistas que aceptamos
  max_por_sector: 12                     # para que no salga todo de un solo sector (p. ej. biotech)
  max_resultados: 60
  # Sectores a priorizar. Lo rellena la skill "buscar-small-caps" tras investigar qué sectores
  # esperan los analistas que vayan bien a 12 meses. Vacío = todos los sectores por igual.
  sectores_prioritarios: [Technology, Industrials, Energy, Financial Services]   # ver investigacion/sectores-2026-11-14.md

# Buscador de oportunidades (embudo + puntuación de 8 factores). Lo ejecuta GitHub Actions cada día.
oportunidades:
  capitalizacion_min_usd: 300000000
  capitalizacion_max_usd: 2000000000
  precio_min_usd: 3
  volumen_medio_min: 100000            # acciones al día
  volumen_dolares_min: 1000000         # y al menos 1 millón de $ negociado al día (para poder entrar y salir)
  max_empresas: 2000                   # cuántas se analizan a fondo (todas las que pasan el filtro)
  hilos: 4
  top_guardado: 150                    # cuántas se guardan en el ranking del panel
  extra_top: 60                        # a cuántas de las mejores se añaden noticias/recomendaciones de Finnhub y Alpaca
  # Peso de cada factor en la nota final (suman 100). Las revisiones de analistas pesan más porque
  # en small caps son de las señales que mejor funcionan para los 12 meses siguientes.
  pesos:
    calidad: 15
    crecimiento: 15
    valoracion: 15
    revisiones: 20
    insiders: 5
    momentum: 10
    catalizadores: 5
    solidez: 15

alertas:
  dias_aviso_catalizador: 10    # avisa si un catalizador (resultados, FDA, contrato...) está a menos de X días
  revisar_tesis_cada_dias: 30   # avisa si un análisis tiene más de X días y conviene repasarlo

# Fuentes públicas GRATIS y sin clave (se usan en GitHub Actions; si una falla, el buscador sigue sin ella).
fuentes_publicas:
  activar: true
  sec: true        # SEC EDGAR: ventas de acciones nuevas (S-3/424B), fondos >5 % (13D/13G), cuentas tarde
  ensayos: true    # ClinicalTrials.gov: ensayos de fase 2/3 con resultados en 12 meses (solo sector salud)
  macro: true      # FRED + IWM: semáforo macro para small caps (no cambia la nota)

# Seguimiento diario para elegir el MOMENTO de entrada (lab medio seguimiento; lo ejecuta GitHub Actions
# cada día laborable). Los niveles salen del "Plan del trader" del análisis de cada empresa.
#   soporte: zona donde buscar la señal A (suelo: vela de giro con volumen, mejor con divergencia del RSI)
#   confirmacion: señal B = dos cierres seguidos por encima de este precio
seguimiento:
  ORIC:
    soporte: [7.2, 7.5]
    confirmacion: 9.3
    entrada_max: 8.5
    stop: 6.5
    objetivo: 13
    tamano_max: "2 %"
    informe: investigacion/analisis/ORIC-2026-11-14.md

# Lista de seguimiento de NOTICIAS (tus empresas). Cada día laborable, tras el cierre, el programa mira si el
# precio se movió más de lo normal, busca el porqué en los titulares, los próximos catalizadores y qué cambió.
# Solo tickers: aquí NO se guardan cantidades ni importes. Para añadir o quitar una empresa, edita esta lista.
#   referencia: fondo (ETF) de su sector, para saber si se movió "con todos" o por algo propio
#   sector: "salud" activa la búsqueda de ensayos clínicos (ClinicalTrials.gov)
lista_noticias:
  umbral_movimiento_pct: 8    # aviso al móvil si sube o baja más de esto en un día...
  umbral_sigmas: 2.5          # ...o si se mueve 2,5 veces más de lo normal para esa acción (y al menos un 3 %)
  umbral_volumen: 2.5         # volumen 2,5 veces su media de 20 días = movimiento que merece explicación
  mercado: SPY
  incluir_vigilancia: true    # añade cada día las empresas de investigacion/watchlist.csv
  incluir_ranking_top: 10     # y las 10 mejores ideas del buscador (de estas solo avisa si hay noticia importante)
  ia:                         # lectura de titulares con Claude Haiku (elegido por Ruben el 15-nov; ~1-2 $ al mes)
    activar: false            # APAGADO (decisión de Ruben 15-nov). Para encender: true + secreto ANTHROPIC_API_KEY en GitHub
    tope_mensual_usd: 3       # al llegar a este gasto en el mes, deja de llamar a Haiku hasta el mes siguiente
  empresas:
    ALT:  {nombre: "Altimmune", sector: salud, referencia: XBI}
    RCAT: {nombre: "Red Cat Holdings", sector: defensa y drones, referencia: ITA}
    MSFT: {nombre: "Microsoft", sector: tecnología, referencia: QQQ, umbral_movimiento_pct: 4}
    RAPP: {nombre: "Rapport Therapeutics", sector: salud, referencia: XBI}
    DFTX: {nombre: "Definium Therapeutics", sector: salud, referencia: XBI}
    POET: {nombre: "POET Technologies", sector: semiconductores, referencia: SOXX}
  materias_primas:
    XAU: {nombre: "Oro", yahoo: "GC=F", umbral_movimiento_pct: 3}
