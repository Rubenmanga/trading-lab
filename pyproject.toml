[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-lab"
version = "0.1.0"
description = "Laboratorio de trading SOLO DEMO: agente intradía y analista de inversión a 12 meses"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6",
    "pandas>=2",
    "numpy>=1.24",
    "alpaca-py>=0.30",
    "yfinance>=0.2.50",
    "python-dotenv>=1",
    "tzdata",
    "streamlit>=1.45",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lab = "tradinglab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
