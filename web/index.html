<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0d10">
<title>Agente de trading</title>
<style>
/* Colores con significado: verde = bien / entra · ámbar = atento · rojo = peligro · azul = información · morado = IA.
   Oscuro por defecto (como el panel del vídeo); claro si el móvil está en modo claro o si se elige con el botón ◐. */
:root{color-scheme:dark;--bg:#0b0d10;--card:#14171c;--card2:#1b1f26;--line:#262c35;--txt:#eef0f3;--sub:#a3abb8;--mut:#7d8592;
  --acc:#3987e5;--ok:#0ca30c;--okt:#3ccb5a;--warn:#fab219;--warnt:#fab219;--bad:#d03b3b;--badt:#f07171;--ia:#9085e9;
  --hm-hi:#3987e5;--hm-lo:#e66767;--hm-mid:#2c2f33;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--shadow:0 1px 0 rgba(255,255,255,.03) inset}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]){color-scheme:light;--bg:#f3f4f6;--card:#fff;--card2:#f4f5f7;--line:#e2e5ea;--txt:#111418;--sub:#4f5662;--mut:#7b828e;
  --acc:#2a78d6;--okt:#006300;--warnt:#8a5a00;--badt:#b42318;--ia:#6250d6;--hm-hi:#2a78d6;--hm-lo:#e34948;--hm-mid:#f0efec;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--shadow:0 1px 2px rgba(0,0,0,.04)}}
:root[data-theme=light]{color-scheme:light;--bg:#f3f4f6;--card:#fff;--card2:#f4f5f7;--line:#e2e5ea;--txt:#111418;--sub:#4f5662;--mut:#7b828e;
  --acc:#2a78d6;--okt:#006300;--warnt:#8a5a00;--badt:#b42318;--ia:#6250d6;--hm-hi:#2a78d6;--hm-lo:#e34948;--hm-mid:#f0efec;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--shadow:0 1px 2px rgba(0,0,0,.04)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--acc)}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px;padding:10px 0}
.logo{width:30px;height:30px;border-radius:9px;flex:none;background:conic-gradient(from 200deg,#3987e5,#9085e9,#d55181,#fab219,#0ca30c,#3987e5)}
.marca{flex:1;min-width:0}
.marca b{display:block;font-size:1.02rem;line-height:1.2}
.marca span{display:block;font-size:.72rem;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:.68rem;font-weight:700;letter-spacing:.06em;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--warnt);white-space:nowrap}
.tema{background:none;border:1px solid var(--line);color:var(--sub);border-radius:999px;width:32px;height:32px;font-size:1rem;cursor:pointer;flex:none}
nav.tabs{display:none;gap:4px;padding:0 0 10px;overflow-x:auto}
nav.tabs a{white-space:nowrap;padding:6px 12px;border-radius:999px;color:var(--sub);text-decoration:none;font-size:.88rem}
nav.tabs a.on{background:var(--card2);color:var(--txt);box-shadow:inset 0 0 0 1px var(--line)}
nav.abajo{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(5,1fr);background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav.abajo a{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mut);text-decoration:none;font-size:.68rem;padding:4px 0}
nav.abajo a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.abajo a.on{color:var(--txt)}
nav.abajo a.on svg{stroke:var(--acc)}
@media (min-width:860px){nav.tabs{display:flex}nav.abajo{display:none}main{padding-bottom:48px!important}}
main{padding:14px 0 96px}
footer{color:var(--mut);font-size:.74rem;text-align:center;padding:0 16px 110px}
@media (min-width:860px){footer{padding-bottom:32px}}
/* Piezas */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 10px;box-shadow:var(--shadow)}
.sec{display:flex;align-items:center;gap:8px;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);margin:22px 0 10px}
.sec::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c,var(--acc));flex:none}
.sec .mas{margin-left:auto;font-weight:600;letter-spacing:0;text-transform:none;font-size:.8rem}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:760px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-decoration:none;color:inherit;display:block;min-width:0;box-shadow:var(--shadow)}
.kpi .lbl{font-size:.66rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .lbl::before{content:"";display:inline-block;width:10px;height:2px;background:var(--c,var(--acc));margin-right:6px;vertical-align:middle}
.kpi .val{font-size:1.9rem;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums;margin-top:4px;letter-spacing:-.01em}
.kpi .det{font-size:.76rem;color:var(--sub);line-height:1.35}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.tk{font-weight:800;font-size:1.05rem;letter-spacing:.01em}
.sub{color:var(--sub);font-size:.86rem}
.mut{color:var(--mut);font-size:.78rem}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.74rem;font-weight:600;background:var(--card2);border:1px solid var(--line);color:var(--sub);white-space:nowrap}
.n{font-variant-numeric:tabular-nums;font-weight:650}
.okt{color:var(--okt)} .badt{color:var(--badt)} .warnt{color:var(--warnt)} .iat{color:var(--ia)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px 12px;margin-top:10px}
.k{font-size:.72rem;color:var(--sub);line-height:1.3}
.empty{color:var(--sub);text-align:center;padding:22px 10px;font-size:.9rem}
.empty b{display:block;color:var(--txt);margin-bottom:2px}
.dos{display:grid;gap:10px}
@media (min-width:760px){.dos{grid-template-columns:1fr 1fr}}
/* Avisos */
.aviso{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-left:3px solid var(--c)}
.aviso .ico{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:.9rem;font-weight:800;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
.aviso .t{font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--sub)}
/* Escala precio (stop · zona · precio · objetivo) */
.esc{position:relative;height:30px;margin:22px 4px 10px}
.esc .pista{position:absolute;left:0;right:0;top:15px;height:6px;border-radius:3px;background:var(--card2);box-shadow:inset 0 0 0 1px var(--line)}
.esc .zona{position:absolute;top:15px;height:6px;border-radius:3px;background:color-mix(in srgb,var(--ok) 55%,transparent)}
.esc .tick{position:absolute;top:10px;width:2px;height:16px;border-radius:1px;transform:translateX(-1px)}
.esc-ley{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.72rem;color:var(--sub);margin:-6px 0 8px}.esc-ley i{display:inline-block;width:3px;height:10px;border-radius:1px;margin-right:5px;vertical-align:-1px}
.esc .et{position:absolute;top:28px;font-size:.68rem;color:var(--sub);white-space:nowrap;transform:translateX(-50%)}
.esc .et.ar{top:-16px;color:var(--txt);font-weight:700}
.esc .pto{position:absolute;top:10px;width:16px;height:16px;border-radius:50%;background:var(--txt);border:3px solid var(--card);transform:translateX(-8px);box-shadow:0 0 0 1px var(--line)}
/* Barras divergentes (cambio del día) */
.div{display:grid;grid-template-columns:52px 1fr 64px;gap:6px 8px;align-items:center;font-size:.82rem}
.div a{color:inherit;text-decoration:none;font-weight:700}
.div .zona2{position:relative;height:14px}
.div .zona2::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--line)}
.div .zona2 i{position:absolute;top:2px;height:10px;border-radius:3px}
.div .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:650}
/* Mapa de calor del ranking */
.hm{width:100%;border-collapse:separate;border-spacing:3px;font-size:.78rem;table-layout:fixed}
.hm th{font-size:.62rem;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.04em;padding:0 0 4px;text-align:center}
.hm td{padding:0;height:30px;text-align:center}
.hm td.tkc{text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hm td.tkc a{color:var(--txt);text-decoration:none;font-weight:800}
.hm td.tkc small{display:block;font-size:.62rem;color:var(--mut);font-weight:500;line-height:1.1;overflow:hidden;text-overflow:ellipsis}
.hm .c{display:grid;place-items:center;height:28px;border-radius:5px;font-variant-numeric:tabular-nums;font-size:.72rem;cursor:pointer}
.hm .nt{font-weight:800;font-size:.92rem;font-variant-numeric:tabular-nums}
.leyenda{display:flex;align-items:center;gap:8px;font-size:.72rem;color:var(--sub);flex-wrap:wrap}
.leyenda .grad{width:120px;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--hm-lo),var(--hm-mid),var(--hm-hi))}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px;scrollbar-width:none}
.chips button{font:inherit;font-size:.8rem;white-space:nowrap;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer}
.chips button.on{background:var(--txt);color:var(--bg);border-color:var(--txt)}
select{font:inherit;font-size:.86rem;padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--txt);max-width:100%}
/* Flujo numerado */
.flujo{display:grid;gap:10px}
@media (min-width:760px){.flujo{grid-template-columns:repeat(4,1fr)}}
.paso{background:var(--card);border:1px solid var(--line);border-top:2px solid var(--c);border-radius:14px;padding:12px 14px}
.paso .cab{display:flex;align-items:center;gap:8px;font-weight:700}
.paso .num{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.75rem;font-weight:800;background:var(--c);color:#fff;flex:none}
.paso .tag{margin-left:auto;font-size:.68rem;color:var(--c);font-weight:600}
.paso dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:8px 0 0;font-size:.8rem}
.paso dt{color:var(--mut)} .paso dd{margin:0}
/* Embudo */
.emb{display:grid;grid-template-columns:110px 1fr 34px;gap:8px;align-items:center;font-size:.82rem}
.emb .b{height:20px;border-radius:5px;background:var(--c);min-width:3px}
/* Línea de tiempo */
.tl{position:relative;margin:0;padding:0;list-style:none}
.tl li{position:relative;padding:0 0 12px 22px}
.tl li::before{content:"";position:absolute;left:5px;top:6px;bottom:-6px;width:1px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl li::after{content:"";position:absolute;left:0;top:5px;width:11px;height:11px;border-radius:50%;background:var(--c,var(--acc));box-shadow:0 0 0 3px var(--card)}
.tl .cuando{font-size:.72rem;color:var(--sub);font-variant-numeric:tabular-nums}
/* Titulares (lo que lee el agente) */
.puntos{display:grid;grid-template-columns:52px 1fr;gap:6px 8px;align-items:center}
.puntos .fila{display:flex;flex-wrap:wrap;gap:4px}
.pt{width:20px;height:20px;border-radius:50%;border:none;padding:0;display:grid;place-items:center;font-size:.6rem;font-weight:800;color:#fff;cursor:pointer;background:var(--c)}
.pt.vieja{opacity:.35}
.pt.imp{box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--c)}
#det-titular{min-height:20px}
/* Markdown */
.md{overflow-wrap:anywhere} .md table{display:block;overflow-x:auto;border-collapse:collapse;font-size:.85rem} .md th,.md td{padding:6px;border-bottom:1px solid var(--line);text-align:left}
.md h1{font-size:1.3rem;line-height:1.3} .md h2{font-size:1.06rem;margin-top:1.6em} .md h3{font-size:.98rem}
.md blockquote{margin:0;padding:4px 12px;border-left:3px solid var(--line);color:var(--sub)}
.md pre{overflow-x:auto;background:var(--card2);padding:10px;border-radius:8px}
table.t{width:100%;border-collapse:collapse;font-size:.85rem}
table.t th,table.t td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.scroll{overflow-x:auto}
details>summary{cursor:pointer;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"›";float:right;color:var(--mut);transition:transform .15s}
details[open]>summary::after{transform:rotate(90deg)}
.flag{color:var(--badt);font-size:.82rem} .sig{color:var(--okt);font-size:.82rem}
.back{display:inline-block;margin-bottom:10px;text-decoration:none;font-size:.88rem}
.menu a{display:flex;gap:12px;align-items:center;text-decoration:none;color:inherit}
.menu .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);font-weight:800;flex:none}
.ficha-cab{display:flex;gap:14px;align-items:center}
.ficha-cab .tit{flex:1;min-width:0}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:6px;vertical-align:middle}
#tip{position:fixed;z-index:20;pointer-events:none;background:var(--txt);color:var(--bg);font-size:.76rem;padding:5px 8px;border-radius:7px;max-width:240px;opacity:0;transition:opacity .1s}
#tip.on{opacity:1}
svg text{font-family:inherit}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="top">
    <div class="logo" aria-hidden="true"></div>
    <div class="marca"><b>Agente de trading</b><span id="sub-cab">Cargando…</span></div>
    <span class="pill">DEMO</span>
    <button class="tema" id="tema" title="Cambiar tema (automático / oscuro / claro)" aria-label="Cambiar tema">◐</button>
  </div>
  <nav class="tabs" id="tabs">
    <a href="#/">Hoy</a><a href="#/cartera">Mis acciones</a><a href="#/ranking">Ranking</a><a href="#/bot">Bot corto</a><a href="#/seguimiento">Seguimiento</a><a href="#/vigilancia">Vigilancia del agente</a><a href="#/duplicar">¿Puede duplicar?</a><a href="#/x6">¿+500 %?</a><a href="#/informes">Informes</a><a href="#/mas">Más</a>
  </nav>
</div></header>
<main class="wrap" id="app"><div class="empty">Cargando…</div></main>
<footer id="pie"></footer>
<nav class="abajo" id="abajo">
  <a href="#/"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Hoy</a>
  <a href="#/cartera"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18"/></svg>Mis acciones</a>
  <a href="#/ranking"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Ranking</a>
  <a href="#/seguimiento"><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4zM8 9h8M8 13h8M8 17h5"/></svg>Noticias</a>
  <a href="#/mas"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>Más</a>
</nav>
<div id="tip"></div>
<script src="vendor/marked.min.js"></script>
<script src="vendor/purify.min.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const vacio = (x) => x === null || x === undefined || x === "" || isNaN(+x);
const num = (x, d = 2) => vacio(x) ? "—" : (+x).toLocaleString("es-ES", {maximumFractionDigits: d, minimumFractionDigits: d});
const pct = (x) => vacio(x) ? "—" : `${+x > 0 ? "+" : ""}${num(x, 1)} %`;
const fecha = (iso) => { try { return new Date(iso).toLocaleString("es-ES", {dateStyle: "medium", timeStyle: "short", timeZone: "Europe/Madrid"}); } catch { return iso; } };
const diaCorto = (iso) => { try { return new Date(iso + (iso.length === 10 ? "T12:00:00Z" : "")).toLocaleDateString("es-ES", {weekday: "short", day: "numeric", month: "short", timeZone: "Europe/Madrid"}); } catch { return iso; } };
const md = (t) => DOMPurify.sanitize(marked.parse(t || ""));
const urlOk = (u) => /^https?:\/\//.test(u || "") ? esc(u) : null;
const VEREDICTO = {comprar_en_zona: "Comprar en zona", vigilar: "Vigilar", descartar: "Descartado"};
const vacioBox = (titulo, texto) => `<div class="card empty"><b>${titulo}</b>${texto}</div>`;
let D = null;
const HOY = () => new Date().toISOString().slice(0, 10);
const dias = (iso) => Math.round((new Date(iso + "T12:00:00Z") - new Date(HOY() + "T12:00:00Z")) / 864e5);

/* ---------- Piezas visuales ---------- */
// Escala horizontal de precios: stop (rojo) · zona de entrada (verde) · precio (punto) · objetivo (azul).
function escala({ precio, stop, zona, objetivo, objBajo }) {
  const vals = [precio, stop, zona, objetivo, objBajo].filter((x) => !vacio(x)).map(Number);
  if (vals.length < 2 || vacio(precio)) return "";
  const lo = Math.min(...vals), hi = Math.max(...vals), pad = (hi - lo) * 0.06 || 1;
  const x = (v) => ((v - (lo - pad)) / (hi - lo + 2 * pad)) * 100;
  let h = `<div class="esc"><div class="pista"></div>`;
  if (!vacio(zona)) h += `<div class="zona" style="left:${x(vacio(stop) ? lo - pad : stop)}%;width:${x(zona) - x(vacio(stop) ? lo - pad : stop)}%"></div>`;
  const m = (v, col) => vacio(v) ? "" : `<div class="tick" style="left:${x(v)}%;background:${col}"></div>`;
  h += m(stop, "var(--bad)") + m(objBajo, "var(--mut)") + m(objetivo, "var(--acc)");
  h += `<div class="pto" style="left:${x(precio)}%"></div><div class="et ar" style="left:${Math.min(88, Math.max(12, x(precio)))}%">${num(precio)} $</div></div>`;
  const ley = (v, col, txt) => vacio(v) ? "" : `<span><i style="background:${col}"></i>${txt} ${num(v, 1)}</span>`;
  h += `<div class="esc-ley">${ley(stop, "var(--bad)", "stop")}${vacio(zona) ? "" : `<span><i style="background:color-mix(in srgb,var(--ok) 55%,transparent);width:12px"></i>zona ≤ ${num(zona, 1)}</span>`}${ley(objBajo, "var(--mut)", "obj. bajo")}${ley(objetivo, "var(--acc)", "objetivo")}</div>`;
  return h;
}
// Barras divergentes: cuánto se movió cada acción hoy (verde sube, rojo baja; flecha y signo para no depender del color).
function divergentes(filas) {
  if (!filas.length) return "";
  const max = Math.max(3, ...filas.map((f) => Math.abs(f.v)));
  return `<div class="div">${filas.map((f) => {
    const w = Math.abs(f.v) / max * 50, pos = f.v >= 0, cero = Math.abs(f.v) < 0.05;
    return `<a href="${f.href || "#/seguimiento"}">${esc(f.t)}</a><div class="zona2" data-tip="${esc(f.tip || "")}"><i style="${pos ? "left:50%" : `left:${50 - w}%`};width:${Math.max(w, 0.6)}%;background:var(--${cero ? "mut" : pos ? "ok" : "bad"})"></i></div><span class="v ${cero ? "mut" : pos ? "okt" : "badt"}">${cero ? "=" : pos ? "▲" : "▼"} ${num(Math.abs(f.v), 1)} %</span>`;
  }).join("")}</div>`;
}
// Anillo con la nota (0-100).
function anillo(v, tam = 64) {
  const r = 26, c = 2 * Math.PI * r, col = v >= 65 ? "var(--ok)" : v >= 45 ? "var(--warn)" : "var(--bad)";

/* ---------- Bot del corto del hueco (agente A) ---------- */
const ACC = { candidata: ["var(--acc)", "Candidata"], descartada: ["var(--mut)", "Descartada"], ensayo: ["var(--ia)", "Ensayo"], "ensayo cierre": ["var(--ia)", "Ensayo cierre"], abierta: ["var(--warn)", "Corto abierto"], cerrada: ["var(--ok)", "Cerrada"], error: ["var(--bad)", "Error"], nada: ["var(--mut)", "Nada hoy"] };
const horaEsp = (hhmm) => { const [h, m] = String(hhmm || "").split(":").map(Number); return isNaN(h) ? "—" : `${String((h + 6) % 24).padStart(2, "0")}:${String(m || 0).padStart(2, "0")}`; };
function bot() {
  const C = D.corto?.config || {}, dd = cortoDias(), cer = cortoCerradas();
  const reales = (D.corto?.registro || []).filter((r) => r.accion === "abierta").length;
  const ganadas = cer.filter((r) => +r.resultado_pct > 0).length, acum = cer.reduce((s, r) => s + +r.resultado_pct, 0);
  let h = `<p class="sub" style="margin-top:0">Agente A · cada día laborable el bot mira qué acciones abren con un gran <b>hueco</b> (abren muy por encima del cierre de ayer) y las vende en <b>corto</b> (gana si bajan) en la cuenta <b>demo</b> de eToro. Todo se cierra el mismo día. No es dinero real.</p>
  <div class="kpis">
    <div class="kpi" style="--c:var(--mut)"><div class="lbl">Días registrados</div><div class="val">${dd.length}</div><div class="det">${dd[0] ? `último: ${esc(diaCorto(dd[0].fecha))}` : "aún ninguno"}</div></div>
    <div class="kpi" style="--c:var(--warn)"><div class="lbl">Cortos abiertos</div><div class="val">${reales}</div><div class="det">en total (demo)</div></div>
    <div class="kpi" style="--c:var(--ok)"><div class="lbl">Acertadas</div><div class="val">${cer.length ? `${ganadas}<span class="mut" style="font-size:1rem"> / ${cer.length}</span>` : "—"}</div><div class="det">${cer.length ? `${Math.round(ganadas / cer.length * 100)} % ganadoras` : "sin operaciones cerradas"}</div></div>
    <div class="kpi" style="--c:var(--acc)"><div class="lbl">Resultado sumado</div><div class="val ${acum > 0 ? "okt" : acum < 0 ? "badt" : ""}">${cer.length ? pct(acum) : "—"}</div><div class="det">suma de % por operación</div></div>
  </div>
  <div class="sec" style="--c:var(--ia)">Cómo decide</div>
  <div class="flujo">
    <div class="paso" style="--c:var(--acc)"><div class="cab"><span class="num">1</span>Escáner<span class="tag">reglas · sin IA</span></div><dl><dt>Mira</dt><dd>hueco ≥ +${num((C.hueco_min ?? 0.5) * 100, 0)} % a las ${esc(String(C.hora_escaneo || "09:34").slice(0, 5))} NY</dd><dt>Filtra</dt><dd>precio ≥ ${num(C.precio_min ?? 1, 0)} $ y ≥ ${num((C.dolares_dia_min ?? 200000) / 1000, 0)} mil $ negociados al día</dd><dt>Y</dt><dd>que eToro deje venderla en corto</dd></dl></div>
    <div class="paso" style="--c:var(--warn)"><div class="cab"><span class="num">2</span>Riesgo<span class="tag">reglas · manda siempre</span></div><dl><dt>Arriesga</dt><dd>${num(C.riesgo_pct ?? 1, 0)} % del capital por operación</dd><dt>Límites</dt><dd>máx. ${C.max_operaciones_dia ?? 3} al día · ${C.max_posicion_pct ?? 10} % por posición · ${C.max_exposicion_pct ?? 30} % en total</dd><dt>Freno</dt><dd>si la cuenta cae un ${C.freno_caida_pct ?? 10} %, deja de abrir</dd></dl></div>
    <div class="paso" style="--c:var(--ia)"><div class="cab"><span class="num">3</span>Orden<span class="tag">${esc(String(C.hora_entrada || "09:35").slice(0, 5))} NY · ${horaEsp(C.hora_entrada || "09:35")} España</span></div><dl><dt>Hace</dt><dd>vende en corto en eToro demo</dd><dt>Stop</dt><dd>${C.stop_pct ?? 15} % por encima de la entrada</dd><dt>Tarde</dt><dd>si llega después de las ${esc(C.hora_limite_entrada || "09:50")} NY, no abre</dd></dl></div>
    <div class="paso" style="--c:var(--ok)"><div class="cab"><span class="num">4</span>Cierre<span class="tag">${esc(C.hora_cierre || "15:45")} NY · ${horaEsp(C.hora_cierre || "15:45")} España</span></div><dl><dt>Hace</dt><dd>cierra todo antes del final de la sesión</dd><dt>Apunta</dt><dd>resultado y motivo de cada decisión</dd><dt>Avisa</dt><dd>con un aviso en GitHub</dd></dl></div>
  </div>
  <div class="mut" style="margin-top:6px">Este bot no usa IA: solo reglas. La hora de España es la habitual (+6 h); puede variar unos días al año por el cambio de hora.</div>`;
  // Curva
  h += `<div class="sec" style="--c:var(--acc)">Curva de resultados (demo)</div>`;
  if (cer.length >= 2) { let s = 0; const serie = [0, ...cer.map((r) => (s += +r.resultado_pct))]; h += `<div class="card">${linea(serie, { base: 0, color: acum >= 0 ? "var(--ok)" : "var(--bad)", etiquetas: ["inicio", ...cer.map((r, i) => `${r.fecha_hora_ny.slice(0, 10)} ${r.simbolo}: ${pct(r.resultado_pct)} (acumulado ${pct(serie[i + 1])})`)] })}<div class="mut">Suma de los % de cada operación cerrada. Toca un punto para ver la operación.</div></div>`; }
  else h += vacioBox("Todavía sin operaciones cerradas", "La curva aparecerá cuando el bot haya cerrado al menos dos cortos en la demo.");
  // Reloj de decisiones
  const horas = (D.corto?.registro || []).filter((r) => ["abierta", "cerrada", "error"].includes(r.accion));
  h += `<div class="sec" style="--c:var(--ia)">Reloj del bot (hora de Nueva York)</div>` + (horas.length >= 3 ? `<div class="card">${reloj(horas)}</div>` : vacioBox("Todavía sin datos", "Cuando haya operaciones reales se verá a qué hora decide y cierra el bot."));
  // Embudo y decisiones por día
  if (!dd.length) return h + `<div class="sec">Decisiones</div>` + vacioBox("Aún sin decisiones", "El bot apunta aquí cada decisión con su motivo a partir de su primer día.");
  const d0 = dd[0], cuenta = (a) => d0.filas.filter((r) => r.accion === a).length;
  const etapas = [["Candidatas", cuenta("candidata"), "var(--acc)"], ["Descartadas", cuenta("descartada"), "var(--mut)"], ["Ensayo (sin orden)", cuenta("ensayo"), "var(--ia)"], ["Cortos abiertos", cuenta("abierta"), "var(--warn)"], ["Cerradas", cuenta("cerrada"), "var(--ok)"]];
  const mx = Math.max(1, ...etapas.map((e) => e[1]));
  h += `<div class="sec" style="--c:var(--acc)">Embudo del ${esc(diaCorto(d0.fecha))}</div><div class="card"><div class="emb">${etapas.map(([n, v, c]) => `<span class="sub">${n}</span><span class="b" style="--c:${c};width:${v / mx * 100}%;opacity:${v ? 1 : .25}"></span><span class="n">${v}</span>`).join("")}</div></div>`;
  h += `<div class="sec">Decisiones con su motivo</div>`;
  h += dd.slice(0, 5).map((d, i) => {
    const inf = D.informes.find((x) => x.id === `investigacion/corto-hueco/${d.fecha}.md`);
    return `<details class="card" ${i === 0 ? "open" : ""}><summary><b>${esc(diaCorto(d.fecha))}</b> <span class="sub">· ${d.filas.length} apuntes</span></summary><ul class="tl" style="margin-top:12px">${d.filas.map((r) => { const [c, nom] = ACC[r.accion] || ["var(--mut)", r.accion]; return `<li style="--c:${c}"><div class="cuando">${esc((r.fecha_hora_ny || "").slice(11, 16))} NY · ${esc(nom)}${vacio(r.resultado_pct) ? "" : ` · <b class="${+r.resultado_pct >= 0 ? "okt" : "badt"}">${pct(r.resultado_pct)}</b>`}</div><div><b>${esc(r.simbolo || "—")}</b> ${esc(r.motivo)}</div></li>`; }).join("")}</ul>${inf ? `<a href="#/informe/${encodeURIComponent(inf.id)}">Informe del día →</a>` : ""}</details>`;
  }).join("");
  return h;
}
function reloj(filas) {
  const cx = 120, cy = 120, R = 92, ang = (hh) => (hh / 24) * 2 * Math.PI - Math.PI / 2;

  const pts = filas.map((r, i) => { const t = (r.fecha_hora_ny || "").slice(11, 16).split(":").map(Number); const hh = t[0] + t[1] / 60, a = ang(hh), rr = R - 10 - (i % 4) * 9; const c = (ACC[r.accion] || ["var(--mut)"])[0]; return `<circle cx="${cx + Math.cos(a) * rr}" cy="${cy + Math.sin(a) * rr}" r="5" fill="${c}" stroke="var(--card)" stroke-width="2" data-tip="${esc(r.fecha_hora_ny)} · ${esc(r.simbolo)} · ${esc(r.accion)}"/>`; }).join("");

    <li><b>Mis acciones:</b> tus acciones reales (Revolut y Trading 212): resultado desde tu compra, análisis, noticias y catalizadores. Son distintas de la <b>Vigilancia del agente</b>, que son empresas que el agente sigue por su cuenta.</li>
    <li><b>Ranking:</b> cada día laborable a las 23:30 el sistema puntúa todas las small caps de EE. UU. en 8 factores. En el mapa de calor, azul es bueno y rojo flojo. Toca una empresa para ver su ficha.</li>
    <li><b>Bot:</b> el agente A (corto del hueco en eToro demo). Cómo decide, qué hizo cada día y por qué.</li>
    <li><b>Noticias:</b> el seguimiento de tus acciones cada 2 h: cuánto se movieron, qué titulares leyó el agente y qué cambió.</li>
    <li><b>Análisis profundo:</b> en el chat del proyecto escribe <i>"Busca oportunidades"</i> o <i>"Analiza ABCD a 12 meses"</i>. El informe aparece aquí solo.</li>
    <li><b>Avisos:</b> si una empresa entra en su zona de entrada, se acerca un catalizador o cae bajo el stop de tesis, te llega una notificación de GitHub.</li>
  </ol>
  <h2>Los 8 factores</h2>
  <ul>
    <li><b>Calidad:</b> márgenes, rentabilidad y flujo de caja (comparada con su sector).</li>
    <li><b>Crecimiento:</b> ventas y beneficios, pasados y previstos.</li>
    <li><b>Valoración:</b> lo barata que está (PER futuro, valor/ventas, flujo de caja), frente a su sector.</li>
    <li><b>Revisiones analistas:</b> si los analistas suben o bajan sus previsiones y recomendaciones.</li>
    <li><b>Directivos:</b> si los directivos compran o venden acciones de su empresa.</li>
    <li><b>Momentum:</b> cómo se ha movido el precio frente al resto.</li>
    <li><b>Catalizadores:</b> resultados cerca, sorpresas positivas recientes.</li>
    <li><b>Solidez:</b> caja, deuda, nuevas acciones emitidas (dilución), posiciones cortas.</li>
  </ul>
  <h2>Palabras</h2>
  <ul>
    <li><b>Zona de entrada:</b> precio por debajo del cual el agente cree que compensa comprar.</li>
    <li><b>Objetivo 12 meses:</b> precio al que cree que puede llegar en un año (estimación propia, no promesa).</li>
    <li><b>Stop de tesis:</b> precio (o hecho) que indicaría que la idea era errónea.</li>
    <li><b>Catalizador:</b> evento con fecha que puede mover mucho la acción (resultados, aprobación, contrato…).</li>
    <li><b>Hueco:</b> cuando una acción abre muy por encima (o por debajo) de donde cerró ayer.</li>
    <li><b>Corto:</b> vender primero y recomprar después; se gana si el precio baja.</li>
    <li><b>Mapa de calor:</b> tabla donde el color de cada casilla dice si el valor es alto o bajo.</li>
  </ul>
  <p class="sub">El agente B no compra ni vende nada. El bot del agente A solo opera en la cuenta demo. Las small caps se mueven mucho: ninguna posición debería ser grande.</p></div>`;
}

/* ---------- Navegación ---------- */
const TITULO = { "/ranking": "Ranking", "/bot": "Bot corto del hueco", "/seguimiento": "Seguimiento de noticias", "/vigilancia": "Vigilancia del agente", "/cartera": "Mis acciones", "/duplicar": "¿Puede duplicar?", "/x6": "¿+500 %?", "/informes": "Informes", "/candidatos": "Cribado simple", "/ayuda": "Cómo se usa", "/mas": "Más", "/fuentes": "Salud de las fuentes" };
const EN_MAS = ["/bot", "/vigilancia", "/duplicar", "/x6", "/informes", "/candidatos", "/ayuda", "/fuentes"];
function pintar(mantener) {
  const r = location.hash.replace(/^#/, "") || "/";
  const pest = r.startsWith("/informe/") ? "/informes" : r.startsWith("/empresa/") ? "/ranking" : r.startsWith("/seguimiento") ? "/seguimiento" : r.startsWith("/cartera") ? "/cartera" : r;
  document.querySelectorAll("#tabs a").forEach((a) => a.classList.toggle("on", a.getAttribute("href") === "#" + pest || (pest !== "/" && !TITULO[pest] && a.getAttribute("href") === "#/mas")));
  document.querySelectorAll("#abajo a").forEach((a) => a.classList.toggle("on", a.getAttribute("href") === "#" + (EN_MAS.includes(pest) ? "/mas" : pest)));
  const app = $("#app");
  if (!D) return;
  const titulo = TITULO[pest] && pest !== "/" ? `<h1 style="font-size:1.25rem;margin:4px 0 12px">${TITULO[pest]}</h1>` : "";
  let cuerpo;
  try {
    cuerpo = r.startsWith("/informe/") ? informe(decodeURIComponent(r.slice(9)))
      : r.startsWith("/empresa/") ? empresaFicha(decodeURIComponent(r.slice(9)))
      : r.startsWith("/seguimiento") ? seguimientoVista(decodeURIComponent(r.slice(13)))
      : r.startsWith("/cartera") ? carteraVista()
      : r === "/ranking" ? oportunidades() : r === "/bot" ? bot() : r === "/informes" ? informes() : r === "/candidatos" ? candidatos()
      : r === "/ayuda" ? ayuda() : r === "/vigilancia" ? resumen() : r === "/duplicar" ? duplicar() : r === "/x6" ? quintuplicar()
      : r === "/mas" ? masVista() : r === "/fuentes" ? fuentesVista() : hoy();
  } catch (e) { console.error(e); cuerpo = vacioBox("Algo ha fallado al dibujar esta parte", esc(e.message)); }
  app.innerHTML = (r.startsWith("/informe/") || r.startsWith("/empresa/") ? "" : titulo) + cuerpo;
  const fs = $("#fs");
  if (fs) fs.onchange = () => { filtroSector = fs.value; cuantas = 30; try { localStorage.setItem("fs", filtroSector); } catch {} pintar(true); };
  document.querySelectorAll("[data-carril]").forEach((b) => b.onclick = () => { filtroCarril = b.dataset.carril; cuantas = 30; try { localStorage.setItem("fc", filtroCarril); } catch {} pintar(true); });
  document.querySelectorAll("[data-inf]").forEach((b) => b.onclick = () => { filtroInf = b.dataset.inf; pintar(true); });
  const mf = $("#mas-filas"); if (mf) mf.onclick = () => { cuantas += 40; pintar(true); };
  document.querySelectorAll("[data-tit]").forEach((b) => b.onclick = () => {
    const n = TITULARES[+b.dataset.tit], [, , c] = familia(n);
    $("#det-titular").innerHTML = `<div class="mut"><span class="dot" style="--c:${c}"></span>${esc(n.nom)} · ${esc(n.t)} · ${esc(n.fecha)} · ${esc(n.fuente || "")}${n.importante ? ' · <b class="warnt">importante</b>' : ""}</div><div>${urlOk(n.url) ? `<a href="${urlOk(n.url)}" target="_blank" rel="noopener">${esc(n.titulo)}</a>` : esc(n.titulo)}</div>`;
  });
  const foco = (r.startsWith("/seguimiento/") && document.getElementById("seg-" + decodeURIComponent(r.slice(13)))) || (r.startsWith("/cartera/") && document.getElementById("pos-" + decodeURIComponent(r.slice(9))));
  if (foco) foco.scrollIntoView({ block: "start" }); else if (!mantener) window.scrollTo(0, 0);
}

// Pistas al tocar o pasar por encima (casillas del mapa de calor, puntos de gráficos…).
const tip = $("#tip");
function verTip(e) {
  const el = e.target.closest?.("[data-tip]");
  if (!el || !el.dataset.tip) { tip.classList.remove("on"); return; }
  tip.textContent = el.dataset.tip; tip.classList.add("on");
  const r = el.getBoundingClientRect(), w = tip.offsetWidth;
  tip.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.left + r.width / 2 - w / 2)) + "px";
  tip.style.top = Math.max(8, r.top - tip.offsetHeight - 8) + "px";
}
addEventListener("pointerover", (e) => { if (e.pointerType === "mouse") verTip(e); });
addEventListener("click", verTip);
addEventListener("scroll", () => tip.classList.remove("on"), { passive: true });

// Tema: automático → oscuro → claro.
const TEMAS = ["auto", "dark", "light"];
function aplicarTema(t) { if (t === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.dataset.theme = t; $("#tema").title = `Tema: ${{ auto: "automático", dark: "oscuro", light: "claro" }[t]}`; }
let tema = "auto"; try { tema = localStorage.getItem("tema") || "auto"; } catch {}
aplicarTema(tema);
$("#tema").onclick = () => { tema = TEMAS[(TEMAS.indexOf(tema) + 1) % 3]; try { localStorage.setItem("tema", tema); } catch {} aplicarTema(tema); };

fetch("datos.json", {cache: "no-store"}).then((r) => r.json()).then((d) => {
  D = d;
  $("#sub-cab").textContent = `Datos al ${D.estado ? fecha(D.estado.actualizado) : fecha(D.construido)} · solo lectura`;
  $("#pie").innerHTML = `Nada de esto es una recomendación de compra. El agente B no opera; el bot del agente A solo usa la cuenta demo.<br>Precios: ${D.estado ? esc(fecha(D.estado.actualizado)) : "aún sin calcular"} · Panel generado: ${esc(fecha(D.construido))}`;
  pintar();
}).catch((e) => { console.error(e); $("#app").innerHTML = vacioBox("No se han podido cargar los datos", "Prueba a recargar la página."); });
addEventListener("hashchange", () => pintar());
</script>
